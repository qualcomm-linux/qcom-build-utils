name: Workflows Sync
description: |
  Sync workflows from qcom-build-utils/.github/pkg-workflows/** back to the
  Qualcomm package repositories.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        type: boolean
        default: false
        required: true
        description: |
          Tick to confirm creating pull requests to sync workflows from
          qcom-build-utils to the Qualcomm package repositories.
          If not ticked, the workflow will not create any pull requests and will simply print the list of repositories that would have been synced.

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: qcom-build-utils

      - name: Sync workflows from qcom-build-utils
        id: sync
        env:
          GH_TOKEN: ${{secrets.DEB_PKG_BOT_CI_TOKEN}}
          ORG: qualcomm-linux
          BOT_NAME: ${{vars.DEB_PKG_BOT_CI_NAME}}
          BOT_EMAIL: ${{vars.DEB_PKG_BOT_CI_EMAIL}}
          BOT_USERNAME: ${{vars.DEB_PKG_BOT_CI_USERNAME}}
          CONFIRMATION_INPUT: ${{ inputs.confirmation }}
        run: |
          # Define explicit list of repositories to exclude
          EXCLUDE_REPOS=("pkg-example" \
                         "pkg-oss-staging-repo" \
                         "pkg-linux-firmware" \
                         "pkg-camera-service-temp" \
                         "pkg-gst-plugins-imsdk-temp" \
                         "pkg-kernel-fedora" \
                         "pkg-linux-kernel" \
                         "pkg-workspace" \
                         "pkg-linux-qcom" \
                         "pkg-linux-qcom-canonical" )

          # Arrays to store created PR URLs and non-fatal sync warnings.
          PR_URLS=()
          WARNINGS=()

          run_cmd() {
            "$@" 2>&1 | sed 's/^/    /'
            return ${PIPESTATUS[0]}
          }

          record_warning() {
            local warning="$1"
            WARNINGS+=("$warning")
            echo "    ⚠️ $warning"
          }

          create_or_reuse_pr() {
            local repo_name="$1"
            local title="$2"
            local body="$3"
            local head_branch="$4"
            local base_branch="$5"
            local pr_url=""
            local pr_error=""
            local pr_error_file

            pr_error_file="$(mktemp)"
            if pr_url=$(gh pr create --repo "$ORG/$repo_name" \
              --title "$title" \
              --body "$body" \
              --head "$head_branch" \
              --base "$base_branch" 2>"$pr_error_file"); then
              PR_URLS+=("$pr_url")
              echo "    ✅ PR created for $base_branch: $pr_url"
              rm -f "$pr_error_file"
              return 0
            fi

            pr_error="$(cat "$pr_error_file")"
            rm -f "$pr_error_file"

            if [[ "$pr_error" == *"A pull request already exists"* ]]; then
              pr_url=$(gh pr list --repo "$ORG/$repo_name" \
                --state open \
                --head "$head_branch" \
                --base "$base_branch" \
                --json url \
                --jq '.[0].url' 2>/dev/null || true)
              if [[ -n "$pr_url" ]]; then
                PR_URLS+=("$pr_url")
                echo "    ℹ️ Reusing existing PR for $base_branch: $pr_url"
                return 0
              fi
            fi

            record_warning "$repo_name:$base_branch PR creation failed: $pr_error"
            return 1
          }

          # Get the list of Qualcomm package repositories
          repos=$(gh repo list --limit 9999 $ORG --json name --jq '.[] | select(.name | startswith("pkg-")) | .name')

          echo "List of repositories starting with 'pkg-': $repos"

          # pkg-pr-hook.yml is checked out locally in pkg-workflows/debian/
          DEBIAN_LATEST_WORKFLOW_FILE="$(pwd)/qcom-build-utils/.github/pkg-workflows/debian/pkg-pr-hook.yml"
          DEBIAN_TARGET_WORKFLOW_FILE=".github/workflows/pkg-pr-hook.yml"
          DEBIAN_LEGACY_WORKFLOW_FILE=".github/workflows/pr-pre-post-merge.yml"
          DEFAULT_BRANCH_WORKFLOW_TEMPLATES=("pkg-build.yml" \
                                             "pkg-pr-check.yml" \
                                             "pkg-promote-prebuilt.yml" \
                                             "pkg-promote.yml" \
                                             "pkg-release.yml")
          LEGACY_UPSTREAM_HELPER_DIR=".github/TO_PASTE_IN_UPSTREAM_REPO"
          echo "📄 Using pkg-pr-hook.yml from pkg-workflows/debian/"

          for repo in $repos; do
            # Skip excluded repositories
            if [[ " ${EXCLUDE_REPOS[@]} " =~ " ${repo} " ]]; then
              echo "⏭️ Skipping excluded repository: $repo"
              continue
            fi

            echo "🔄 Checking repo: $repo"

            # Check if the bot account has write or admin permissions
            echo "  🔍 Checking permissions for $BOT_USERNAME on $repo"
            permission_response=$(gh api repos/$ORG/$repo/collaborators/$BOT_USERNAME/permission 2>/dev/null || echo "")

            if [[ -z "$permission_response" ]]; then
              echo "    ⛔ Cannot verify permissions for $BOT_USERNAME on $repo - skipping"
              continue
            fi

            permission_level=$(echo "$permission_response" | jq -r '.permission')

            if [[ "$permission_level" != "admin" && "$permission_level" != "write" ]]; then
              echo "    ⛔ $BOT_USERNAME does not have write/admin permissions on $repo (has: $permission_level) - skipping"
              continue
            fi

            echo "  ✅ $BOT_USERNAME has $permission_level permissions on $repo"

            # Clone the target repository
            if ! run_cmd gh repo clone "$ORG/$repo" "$repo"; then
              record_warning "$repo: clone failed, skipping repository"
              continue
            fi

            if ! cd "$repo"; then
              record_warning "$repo: failed to enter cloned repository directory"
              continue
            fi

            # Detect the default branch (usually 'main' but some repos use 'master')
            default_branch=$(gh api repos/$ORG/$repo --jq '.default_branch' 2>/dev/null || true)
            if [[ -z "$default_branch" ]]; then
              record_warning "$repo: could not determine default branch, skipping repository"
              cd ..
              continue
            fi
            echo "  🌿 Default branch for $repo: $default_branch"

            # Configure git to use gh CLI for authentication
            gh auth setup-git
            git config user.name "$BOT_NAME"
            git config user.email "$BOT_EMAIL"

            # Delete the sync branch if it exists from a previous run
            if git ls-remote --exit-code --heads origin sync/qcom-build-utils-workflows > /dev/null 2>&1; then
              echo "    🧹 Deleting existing sync/qcom-build-utils-workflows branch from remote"
              run_cmd git push origin --delete sync/qcom-build-utils-workflows || record_warning "$repo:$default_branch failed to delete stale sync/qcom-build-utils-workflows"
            fi

            # Track if changes are needed
            isDirty=false

            # Remove legacy per-repo workflows_sync workflow if present.
            # The source of truth is qcom-build-utils/.github/workflows/workflows_sync.yml.
            if [[ -f ".github/workflows/workflows_sync.yml" ]]; then
              echo "    🗑️ Removing deprecated workflows_sync.yml"
              rm ".github/workflows/workflows_sync.yml"
              isDirty=true
            fi

            # Remove obsolete helper folder that used to be copied manually into
            # upstream repos.
            if [[ -d "$LEGACY_UPSTREAM_HELPER_DIR" ]]; then
              echo "    🗑️ Removing obsolete $LEGACY_UPSTREAM_HELPER_DIR"
              rm -rf "$LEGACY_UPSTREAM_HELPER_DIR"
              isDirty=true
            fi

            # Remove any workflow files that still use pull_request_target.
            # Those are legacy/stale and should not remain in pkg-repos.
            if [[ -d ".github/workflows" ]]; then
              pr_target_workflows=$(grep -R -l --include='*.yml' --include='*.yaml' 'pull_request_target' .github/workflows 2>/dev/null || true)
              if [[ -n "$pr_target_workflows" ]]; then
                echo "    🗑️ Removing workflows containing pull_request_target"
                while IFS= read -r workflow_file; do
                  [[ -z "$workflow_file" ]] && continue
                  echo "      - $workflow_file"
                  rm -f "$workflow_file"
                done <<< "$pr_target_workflows"
                isDirty=true
              fi
            fi

            # Remove legacy default-branch caller workflow names. New names are
            # synced from .github/pkg-workflows/qli-ci/*.yml below.
            for legacy_main_workflow in build-debian-package.yml promote-prebuilt.yml promote-upstream.yml release.yml; do
              legacy_main_path=".github/workflows/$legacy_main_workflow"
              if [[ -f "$legacy_main_path" ]]; then
                echo "    🗑️ Removing legacy workflow: $legacy_main_workflow"
                rm "$legacy_main_path"
                isDirty=true
              fi
            done

            # Remove standalone debusine-* callers now replaced by pkg-* flows.
            if [[ -d ".github/workflows" ]]; then
              debusine_workflows=$(find .github/workflows -maxdepth 1 -type f \
                \( -name 'debusine-*.yml' -o -name 'debusine-*.yaml' \) \
                | sort || true)
              if [[ -n "$debusine_workflows" ]]; then
                echo "    🗑️ Removing legacy debusine-* workflows"
                while IFS= read -r workflow_file; do
                  [[ -z "$workflow_file" ]] && continue
                  echo "      - $workflow_file"
                  rm -f "$workflow_file"
                done <<< "$debusine_workflows"
                isDirty=true
              fi
            fi

            # Remove legacy PR workflow file on default branch. The canonical
            # PR hook workflow is pkg-pr-hook.yml.
            if [[ -f "$DEBIAN_LEGACY_WORKFLOW_FILE" ]]; then
              echo "    🗑️ Removing legacy workflow: $(basename "$DEBIAN_LEGACY_WORKFLOW_FILE")"
              rm "$DEBIAN_LEGACY_WORKFLOW_FILE"
              isDirty=true
            fi

            # Compare and sync workflow files
            for workflow_name in "${DEFAULT_BRANCH_WORKFLOW_TEMPLATES[@]}"; do
              workflow="../qcom-build-utils/.github/pkg-workflows/qli-ci/$workflow_name"
              if [[ ! -f "$workflow" ]]; then
                echo "    ❌ Missing workflow template in qcom-build-utils: $workflow_name"
                exit 1
              fi

              target_workflow=".github/workflows/$workflow_name"

              if [[ -f "$target_workflow" ]]; then
                if diff -q "$workflow" "$target_workflow" > /dev/null; then
                  echo "    ✅ $workflow_name is up to date"
                else
                  echo "    ❌ $workflow_name differs from template"
                  cp "$workflow" "$target_workflow"
                  isDirty=true
                fi
              else
                echo "    + Creating $workflow_name (missing from $repo)"
                mkdir -p ".github/workflows"
                cp "$workflow" "$target_workflow"
                isDirty=true
              fi
            done

              # Create branch, commit, and push default branch changes if needed
              if [[ "$isDirty" == "true" ]]; then
                echo "    📝 Creating branch and committing default branch changes"
                if ! run_cmd git checkout -b sync/qcom-build-utils-workflows; then
                  record_warning "$repo:$default_branch failed to create sync branch"
                  cd ..
                  continue
                fi
                git add -A .github/
                if ! run_cmd git commit -s -m "chore: sync workflows from qcom-build-utils"; then
                  record_warning "$repo:$default_branch failed to commit default-branch sync"
                  cd ..
                  continue
                fi

                if [[ "$CONFIRMATION_INPUT" == "true" ]]; then
                  echo "    🚀 Pushing changes and creating PR for $default_branch"
                  if run_cmd git push origin sync/qcom-build-utils-workflows; then
                    create_or_reuse_pr \
                      "$repo" \
                      "chore: sync workflows from qcom-build-utils" \
                      "This PR syncs the latest workflows from qcom-build-utils." \
                      "sync/qcom-build-utils-workflows" \
                      "$default_branch" || true
                  else
                    record_warning "$repo:$default_branch failed to push sync/qcom-build-utils-workflows"
                  fi
                else
                  echo "    👀 Dry-run mode - No PR will be created for $default_branch"
                fi

                # Return to default branch before packaging-branch sync
                if ! run_cmd git checkout "$default_branch"; then
                  record_warning "$repo:$default_branch failed to return to default branch"
                  cd ..
                  continue
                fi
              else
                echo "    ✨ No default branch changes needed for $repo"
              fi

              # Cleanup-only pass for non-packaging branches:
              # delete stale workflows that still contain pull_request_target.
              # Ignore LFS/archive-style branches (for example pristine*,
              # upstream/*) so sync can complete even when those branches are
              # not check-outable in CI.
              other_branches=$(git for-each-ref --format='%(refname:short)' refs/remotes/origin \
                | sed 's|^origin/||' \
                | grep -Ev '^HEAD$' \
                | grep -Ev '^origin$' \
                | grep -Ev '(^|/)pr/|^promotion-pr/' \
                | grep -Ev '^sync/' \
                | grep -v "^${default_branch}$" \
                | grep -Ev '^(debian/|ubuntu/|qcom/debian/|qcom/ubuntu/)' \
                | grep -Ev '^(pristine($|[-/])|upstream/)' \
                | sort -u)

              for other_branch in $other_branches; do
                echo "  🌿 Checking stale pull_request_target workflows on branch: $other_branch"
                safe_branch_name="${other_branch//\//-}"
                cleanup_sync_branch="sync/qcom-build-utils-pr-target-cleanup-${safe_branch_name}"

                if ! run_cmd git checkout "$other_branch"; then
                  record_warning "$repo:$other_branch checkout failed during cleanup pass"
                  continue
                fi
                isCleanupDirty=false

                if [[ -d ".github/workflows" ]]; then
                  pr_target_workflows=$(grep -R -l --include='*.yml' --include='*.yaml' 'pull_request_target' .github/workflows 2>/dev/null || true)
                  if [[ -n "$pr_target_workflows" ]]; then
                    echo "    🗑️ Removing workflows containing pull_request_target on $other_branch"
                    while IFS= read -r workflow_file; do
                      [[ -z "$workflow_file" ]] && continue
                      echo "      - $workflow_file"
                      rm -f "$workflow_file"
                    done <<< "$pr_target_workflows"
                    isCleanupDirty=true
                  fi

                  debusine_workflows=$(find .github/workflows -maxdepth 1 -type f \
                    \( -name 'debusine-*.yml' -o -name 'debusine-*.yaml' \) \
                    | sort || true)
                  if [[ -n "$debusine_workflows" ]]; then
                    echo "    🗑️ Removing legacy debusine-* workflows on $other_branch"
                    while IFS= read -r workflow_file; do
                      [[ -z "$workflow_file" ]] && continue
                      echo "      - $workflow_file"
                      rm -f "$workflow_file"
                    done <<< "$debusine_workflows"
                    isCleanupDirty=true
                  fi
                fi

                if [[ "$isCleanupDirty" == "true" ]]; then
                  if git ls-remote --exit-code --heads origin "$cleanup_sync_branch" > /dev/null 2>&1; then
                    echo "    🧹 Deleting existing $cleanup_sync_branch"
                    run_cmd git push origin --delete "$cleanup_sync_branch" || record_warning "$repo:$other_branch failed deleting stale $cleanup_sync_branch"
                  fi

                  if ! run_cmd git checkout -b "$cleanup_sync_branch"; then
                    record_warning "$repo:$other_branch failed creating $cleanup_sync_branch"
                    continue
                  fi
                  git add -A .github/
                  if ! run_cmd git commit -s -m "chore: remove pull_request_target workflows"; then
                    record_warning "$repo:$other_branch failed committing cleanup changes"
                    continue
                  fi

                  if [[ "$CONFIRMATION_INPUT" == "true" ]]; then
                    echo "    🚀 Pushing changes and creating PR for $other_branch"
                    if run_cmd git push origin "$cleanup_sync_branch"; then
                      create_or_reuse_pr \
                        "$repo" \
                        "chore: remove pull_request_target workflows" \
                        "This PR removes stale workflow files that still contain \`pull_request_target\`." \
                        "$cleanup_sync_branch" \
                        "$other_branch" || true
                    else
                      record_warning "$repo:$other_branch failed pushing $cleanup_sync_branch"
                    fi
                  else
                    echo "    👀 Dry-run mode - No PR will be created for $other_branch"
                  fi
                else
                  echo "    ✨ No pull_request_target workflow cleanup needed on $other_branch"
                fi

                if ! run_cmd git checkout "$default_branch"; then
                  record_warning "$repo:$default_branch failed returning from cleanup pass"
                  break
                fi
              done

              # Sync pkg-pr-hook.yml to every managed packaging branch family.
              # Supported families:
              #   - debian/*
              #   - ubuntu/*
              #   - qcom/debian/*
              #   - qcom/ubuntu/*
              # Exclude transient promotion branches (*/pr/*).
              packaging_branches=$(git for-each-ref --format='%(refname:short)' refs/remotes/origin \
                | sed 's|^origin/||' \
                | grep -Ev '^HEAD$' \
                | grep -Ev '^origin$' \
                | grep -E '^(debian/|ubuntu/|qcom/debian/|qcom/ubuntu/)' \
                | grep -Ev '(^|/)pr/|^promotion-pr/' \
                | sort -u)

              for packaging_branch in $packaging_branches; do
                echo "  🌿 Checking pkg-pr-hook.yml on branch: $packaging_branch"
                safe_branch_name="${packaging_branch//\//-}"
                debian_sync_branch="sync/qcom-build-utils-pkg-pr-hook-${safe_branch_name}"

                # Delete existing sync branch if from a previous run
                if git ls-remote --exit-code --heads origin "$debian_sync_branch" > /dev/null 2>&1; then
                  echo "    🧹 Deleting existing $debian_sync_branch"
                  run_cmd git push origin --delete "$debian_sync_branch" || record_warning "$repo:$packaging_branch failed deleting stale $debian_sync_branch"
                fi

                if ! run_cmd git checkout "$packaging_branch"; then
                  record_warning "$repo:$packaging_branch checkout failed"
                  continue
                fi

                isDebianDirty=false

                if [[ -f "$DEBIAN_LEGACY_WORKFLOW_FILE" ]]; then
                  echo "    🗑️ Removing legacy pr-pre-post-merge.yml on $packaging_branch"
                  rm "$DEBIAN_LEGACY_WORKFLOW_FILE"
                  isDebianDirty=true
                fi

                if [[ -d "$LEGACY_UPSTREAM_HELPER_DIR" ]]; then
                  echo "    🗑️ Removing obsolete $LEGACY_UPSTREAM_HELPER_DIR on $packaging_branch"
                  rm -rf "$LEGACY_UPSTREAM_HELPER_DIR"
                  isDebianDirty=true
                fi

                if [[ -d ".github/workflows" ]]; then
                  pr_target_workflows=$(grep -R -l --include='*.yml' --include='*.yaml' 'pull_request_target' .github/workflows 2>/dev/null || true)
                  if [[ -n "$pr_target_workflows" ]]; then
                    echo "    🗑️ Removing workflows containing pull_request_target on $packaging_branch"
                    while IFS= read -r workflow_file; do
                      [[ -z "$workflow_file" ]] && continue
                      echo "      - $workflow_file"
                      rm -f "$workflow_file"
                    done <<< "$pr_target_workflows"
                    isDebianDirty=true
                  fi

                  debusine_workflows=$(find .github/workflows -maxdepth 1 -type f \
                    \( -name 'debusine-*.yml' -o -name 'debusine-*.yaml' \) \
                    | sort || true)
                  if [[ -n "$debusine_workflows" ]]; then
                    echo "    🗑️ Removing legacy debusine-* workflows on $packaging_branch"
                    while IFS= read -r workflow_file; do
                      [[ -z "$workflow_file" ]] && continue
                      echo "      - $workflow_file"
                      rm -f "$workflow_file"
                    done <<< "$debusine_workflows"
                    isDebianDirty=true
                  fi
                fi

                if [[ -f "$DEBIAN_TARGET_WORKFLOW_FILE" ]]; then
                  if diff -q "$DEBIAN_LATEST_WORKFLOW_FILE" "$DEBIAN_TARGET_WORKFLOW_FILE" > /dev/null; then
                    echo "    ✅ pkg-pr-hook.yml is up to date on $packaging_branch"
                  else
                    echo "    ❌ pkg-pr-hook.yml differs on $packaging_branch"
                    cp "$DEBIAN_LATEST_WORKFLOW_FILE" "$DEBIAN_TARGET_WORKFLOW_FILE"
                    isDebianDirty=true
                  fi
                else
                  echo "    + Creating pkg-pr-hook.yml on $packaging_branch (missing)"
                  mkdir -p ".github/workflows"
                  cp "$DEBIAN_LATEST_WORKFLOW_FILE" "$DEBIAN_TARGET_WORKFLOW_FILE"
                  isDebianDirty=true
                fi

                if [[ "$isDebianDirty" == "true" ]]; then
                  if ! run_cmd git checkout -b "$debian_sync_branch"; then
                    record_warning "$repo:$packaging_branch failed creating $debian_sync_branch"
                    continue
                  fi
                  git add -A .github/
                  if ! run_cmd git commit -s -m "chore: sync pkg-pr-hook from qcom-build-utils"; then
                    record_warning "$repo:$packaging_branch failed committing pkg-pr-hook sync"
                    continue
                  fi

                  if [[ "$CONFIRMATION_INPUT" == "true" ]]; then
                    echo "    🚀 Pushing changes and creating PR for $packaging_branch"
                    if run_cmd git push origin "$debian_sync_branch"; then
                      create_or_reuse_pr \
                        "$repo" \
                        "chore: sync pkg-pr-hook from qcom-build-utils" \
                        "This PR syncs \`pkg-pr-hook.yml\` from qcom-build-utils \`.github/pkg-workflows/debian/\`." \
                        "$debian_sync_branch" \
                        "$packaging_branch" || true
                    else
                      record_warning "$repo:$packaging_branch failed pushing $debian_sync_branch"
                    fi
                  else
                    echo "    👀 Dry-run mode - No PR will be created for $packaging_branch"
                  fi
                fi
              done

            cd ..
          done

          # Output summary of created PRs
          if [[ "${#PR_URLS[@]}" -gt 0 ]]; then
            echo "🎉 Created PRs for the following repositories:"
            for pr_url in "${PR_URLS[@]}"; do
              echo "  - $pr_url"
            done
          else
            echo "ℹ️ No PRs were created."
          fi

          if [[ "${#WARNINGS[@]}" -gt 0 ]]; then
            echo "⚠️ Sync completed with warnings:"
            for warning in "${WARNINGS[@]}"; do
              echo "  - $warning"
            done
          else
            echo "✅ Sync completed with no warnings."
          fi
